<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070B14">
<title>Aureus Capital — Executive Summary</title>
<style>
:root{--midnight:#070B14;--graphite:#10172A;--gold:#DFB373;--blue:#3B82F6;--green:#10B981;--white:#F9FAFB;--grey:#9CA3AF;--danger:#EF4444;--line:rgba(223,179,115,.25);--card:linear-gradient(135deg,rgba(19,27,46,.92),rgba(10,15,29,.97)}
*{box-sizing:border-box}
body{margin:0;background:var(--midnight);color:var(--white);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:90px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.muted{color:var(--grey)}
.gold{color:var(--gold)}
.green{color:var(--green)}
.blue{color:var(--blue)}
.danger{color:var(--danger)}
.tiny{font-size:10px}
.small{font-size:12px}
.uppercase{text-transform:uppercase;letter-spacing:.12em}
.wrap{max-width:1050px;margin:auto;padding:16px}
.topbar{position:sticky;top:0;z-index:10;background:rgba(7,11,20,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:42px;height:42px;border:1px solid var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold);font-weight:900;font-family:Georgia,serif;background:linear-gradient(135deg,#1b2439,#070b14);overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover}
.brandname{font-size:10px;letter-spacing:.16em;font-weight:900;color:var(--gold);text-transform:uppercase}
.top-actions{display:flex;gap:8px;align-items:center}
.pill{font-size:10px;border:1px solid rgba(59,130,246,.4);background:rgba(30,58,138,.25);color:#93c5fd;border-radius:99px;padding:6px 9px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 32px #0005;backdrop-filter:blur(8px)}
.card+.card{margin-top:14px}
.grid{display:grid;gap:12px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:#070b14cc;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--grey);font-weight:700}
.value{font-size:clamp(16px,3vw,27px);font-weight:850;letter-spacing:-.03em;overflow-wrap:anywhere;margin-top:6px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sectionhead h2{font-size:17px;margin:2px 0}
.sectionhead p{margin:0}
.tabs{position:fixed;z-index:20;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));background:rgba(7,11,20,.97);border-top:1px solid var(--line);backdrop-filter:blur(12px)}
.tab{border:0;background:transparent;color:var(--grey);border-radius:12px;padding:9px 2px;font-size:11px}
.tab span{display:block;font-size:18px;margin-bottom:3px}
.tab.active{background:rgba(223,179,115,.12);color:var(--gold);font-weight:800}
.btn{border:1px solid var(--line);background:#0a1020;color:var(--gold);border-radius:10px;padding:10px 13px;font-weight:750;font-size:12px}
.btn.primary{background:linear-gradient(135deg,#dfb373,#c6a56a);color:#070b14;border:0}
.btn.bluebtn{background:#2563eb;color:white;border:0}
.btn.redbtn{border-color:#7f1d1d;color:#fca5a5}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:11px;color:var(--grey);font-weight:700}
.input,select,textarea{width:100%;min-width:0;background:#070b14;color:var(--white);border:1px solid rgba(223,179,115,.3);border-radius:10px;padding:11px 12px;font-size:13px}
.input::placeholder,textarea::placeholder{color:#6b7280}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid .wide{grid-column:1/-1}
.hidden{display:none!important}
.list{display:grid;gap:10px}
.person{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:14px;padding:13px;background:#0b1120}
.person.goldtier{border-left-color:var(--gold)}
.person.silvertier{border-left-color:#94a3b8}
.person.bronzetier{border-left-color:#b45309}
.personhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.person h3{margin:0 0 4px;font-size:14px;overflow-wrap:anywhere}
.person p{margin:3px 0;font-size:11px}
.amount{font-weight:850;color:var(--gold);font-size:16px}
.notice{border:1px solid rgba(59,130,246,.35);background:rgba(30,58,138,.16);color:#bfdbfe;padding:11px;border-radius:11px;font-size:12px;line-height:1.5}
.notice.warn{border-color:#92400e;background:#451a0344;color:#fcd34d}
.notice.error{border-color:#991b1b;background:#450a0a55;color:#fecaca}
.notice.ok{border-color:#065f46;background:#064e3b44;color:#a7f3d0}
.progress{height:9px;border-radius:99px;background:#030712;border:1px solid var(--line);overflow:hidden;padding:1px}
.progress div{height:100%;border-radius:99px;background:linear-gradient(90deg,#059669,#10b981);width:0}
.divider{height:1px;background:var(--line);margin:14px 0}
.empty{text-align:center;color:var(--grey);padding:24px 12px;border:1px dashed #374151;border-radius:12px;font-size:12px}
.toast{position:fixed;z-index:50;top:75px;left:50%;transform:translateX(-50%);max-width:90vw;background:#111827;border:1px solid var(--gold);border-radius:12px;padding:11px 15px;font-size:12px;box-shadow:0 10px 35px #0009}
.modalback{position:fixed;inset:0;background:#000b;z-index:40;display:grid;place-items:center;padding:16px}
.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#0b1120;border:1px solid var(--line);border-radius:18px;padding:18px}
.modal h2{margin:0 0 16px;font-size:18px}
.footer-note{font-size:10px;color:var(--grey);line-height:1.5}
.logo-preview{width:54px;height:54px;object-fit:cover;border:1px solid var(--gold);border-radius:12px}
@media(max-width:620px){
.wrap{padding:12px}
.card{padding:14px}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
.topbar{padding:10px 12px}
.pill{display:none}
.formgrid{grid-template-columns:1fr}
.formgrid .wide{grid-column:auto}
.sectionhead{align-items:flex-start}
.value{font-size:18px}
.grid3 .label{font-size:9px}
.grid3 .value{font-size:14px}
}
@media(prefers-reduced-motion:no-preference){
.glow{animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 20px #dfb37318}50%{box-shadow:0 0 32px #dfb37335}}
}
</style>
</head>
