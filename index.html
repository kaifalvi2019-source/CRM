<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aureus Capital</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#080B0A;--card:#111816;--em:#00B982;--gold:#C6A56A;--red:#FF5C64;--slate:#374151;--mut:#8D9A93;--tx:#F4F6F5}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-variant-numeric:tabular-nums;word-break:break-word}
#app{max-width:720px;margin:0 auto;padding:12px 14px calc(88px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 12px}
header b{color:var(--gold);letter-spacing:.12em}
.ic{background:none;border:1px solid var(--slate);color:var(--tx);border-radius:10px;width:38px;height:38px;font-size:18px}
.card{background:var(--card);border:1px solid var(--slate);border-radius:14px;padding:14px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.big{font-size:clamp(20px,6vw,28px);font-weight:700}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.m{color:var(--mut);font-size:12px}.pos{color:var(--em)}.neg{color:var(--red)}.gold{color:var(--gold)}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #1d2723}
.row small{display:block;color:var(--mut)}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--slate);border-radius:10px;padding:10px;font:inherit;margin:4px 0}
label{font-size:12px;color:var(--mut)}
button.b{background:var(--em);color:#04120d;border:0;border-radius:10px;padding:10px 14px;font-weight:600;margin:3px 3px 3px 0}
button.s{background:transparent;color:var(--tx);border:1px solid var(--slate)}
button.d{background:var(--red);color:#fff}
button:disabled{opacity:.4}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--slate);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 4px;font-size:12px}
nav button.on{color:var(--em);font-weight:700}
.tag{display:inline-block;border:1px solid var(--slate);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--mut)}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal>div{background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 28px}
.sc{overflow-x:auto}
</style></head><body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="mod"></div>
<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const c2=x=>Math.round(x*100);               // dollars -> integer cents
const f$=c=>c==null?'Unavailable':'$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fI=c=>c==null?'Unavailable':'₹'+(c/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const cmp$=c=>{if(c==null)return'Unavailable';const v=c/100,a=Math.abs(v);return'$'+(a>=1e9?(v/1e9).toFixed(1)+'B':a>=1e6?(v/1e6).toFixed(1)+'M':a>=1e3?(v/1e3).toFixed(1)+'K':v.toFixed(2))};
const cmpI=c=>{if(c==null)return'Unavailable';const v=c/100;return'₹'+(v>=1e7?(v/1e7).toFixed(1)+' Cr':v>=1e5?(v/1e5).toFixed(1)+' L':v.toFixed(2))};
const R=(n,p=0)=>Math.round(n); // integer-cent rounding, half away from zero for positives (ROUND_HALF_UP)
/* ---------- state ---------- */
const DEF={yield:12,mgmt:1.5,perf:10,cust:0.2,brk:0.1,levy:0.05,spread:0.5,tds:10,gst:18};
let S={tab:'home',inv:LS.get('inv',[]),rates:LS.get('rates',{...DEF}),hist:LS.get('hist',[]),set:LS.get('set',{history:true,cycleStart:'2026-09-01',cycleEnd:'2026-12-31'}),
 strat:LS.get('strat',[]),mode:'paper',q:'',fa:'all',fc:'all',fx:null,sel:{id:'',from:'2026-09-01',to:'2026-10-10'}};
const save=()=>{LS.set('inv',S.inv);LS.set('rates',S.rates);LS.set('hist',S.hist);LS.set('set',S.set);LS.set('strat',S.strat)};
const CATS=['Individual','Family Office','Corporate','Trust','Fund'];
/* ---------- FX (live only if provider answers) ---------- */
async function loadFX(){try{const r=await fetch('https://open.er-api.com/v6/latest/USD');const j=await r.json();if(j.result==='success'&&j.rates.INR)S.fx={rate:j.rates.INR,src:'open.er-api.com',at:new Date().toISOString(),live:true};}catch(e){}render()}
const fxLabel=()=>S.fx?(S.fx.manual?'Manual · '+new Date(S.fx.at).toLocaleString():'Live · '+S.fx.src+' · '+new Date(S.fx.at).toLocaleTimeString()):'Unavailable';
/* ---------- 13-factor engine (integer cents, ROUND_HALF_UP per step) ---------- */
function days(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
function calc(P$,from,to,r,fx){
 const P=c2(P$),d=days(from,to),p=x=>x/100;
 if(!(P>0)||!(d>0))return null;
 const gross=R(P*p(r.yield)*d/365);
 const mgmt=R(P*p(r.mgmt)*d/365), perf=R(gross*p(r.perf)), cust=R(P*p(r.cust)*d/365), brk=R(gross*p(r.brk)), levy=R(gross*p(r.levy));
 const gst=R((mgmt+cust+brk)*p(r.gst)), tds=R(gross*p(r.tds));
 const ded=mgmt+perf+cust+brk+levy+gst+tds, net=gross-ded;
 const eff=fx?fx*(1-p(r.spread)):null, spreadI=fx?R(net*(fx-eff)):null, inr=fx?R(net*eff):null;
 return{P,d,gross,mgmt,perf,cust,brk,levy,fx,spread:p(r.spread),eff,spreadI,gst,tds,ded,net,inr,r:{...r},at:new Date().toISOString()};
}
const BASIS=['Input','Actual/365: end − start days','Annual yield % (override of default)','Principal × yield × days/365','Principal × fee % × days/365','Gross × perf fee %','Principal × custody % × days/365','Gross × brokerage %','Gross × levy %','Live/manual USD/INR','Net USD × spread % (INR loss)','Gross × TDS % (withholding on gross)','(Mgmt+Custody+Brokerage) × GST %'];
function ledger(c){return c?[['1 Principal',f$(c.P)],['2 Day Count',c.d+' days'],['3 Yield / Return Engine',c.r.yield+'% p.a.'],['4 Gross Generated',f$(c.gross)],['5 Management Fee',f$(c.mgmt)],['6 Performance Fee',f$(c.perf)],['7 Custody & Admin',f$(c.cust)],['8 Brokerage / Txn',f$(c.brk)],['9 Regulatory Levy',f$(c.levy)],['10 USD/INR FX',c.fx?c.fx.toFixed(4):'Unavailable'],['11 FX Spread',c.fx?c.spread*100+'% = '+fI(c.spreadI):'Unavailable'],['12 TDS / Withholding',f$(c.tds)],['13 GST on Fees',f$(c.gst)]]:[]}
/* ---------- render ---------- */
function render(){
 const T=[['home','Home'],['inv','Investors'],['stm','Statements'],['algo','Algo Desk']];
 $('#nav').innerHTML=T.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="S.tab='${t[0]}';render();scrollTo(0,0)">${t[1]}</button>`).join('');
 const titles={home:'Home',inv:'Investors',stm:'Statements',algo:'Algo Desk'};
 $('#app').innerHTML=`<header><b>AUREUS CAPITAL</b><span class="m">${titles[S.tab]}</span><button class="ic" onclick="settings()" aria-label="Settings">⚙</button></header>`+({home,inv,stm,algo}[S.tab])();
}
/* ---------- HOME ---------- */
function payoutOf(i){const c=calc(i.capital,S.set.cycleStart,today(),S.rates,S.fx?S.fx.rate:null);return c}
const today=()=>new Date().toISOString().slice(0,10);
function home(){
 const A=S.inv.filter(i=>i.active),cap=S.inv.reduce((a,i)=>a+c2(i.capital),0);
 const cs=S.set.cycleStart,ce=S.set.cycleEnd,tot=days(cs,ce),el=Math.max(0,Math.min(tot,days(cs,today()))),pct=tot>0?Math.round(el/tot*100):0;
 let pend=0,pendI=0,fxOK=!!S.fx;S.inv.filter(i=>i.active).forEach(i=>{const c=payoutOf(i);if(c){pend+=c.net;pendI+=c.inr||0}});
 const mo=['Sep','Oct','Nov','Dec'].map((m,k)=>`<div class="row"><span>${m}</span><span class="m">Target ${f$(S.inv.reduce((a,i)=>a+Math.round(c2(i.capital)*S.rates.yield/1200),0))} · Actual <b>Not recorded</b></span></div>`).join('');
 const top=[...S.inv].sort((a,b)=>b.capital-a.capital).slice(0,5).map(i=>`<div class="row"><span>${esc(i.name)}<small>${esc(i.cat)}</small></span><span>${cmp$(c2(i.capital))}<small>${cap?(c2(i.capital)/cap*100).toFixed(1):0}%</small></span></div>`).join('')||'<div class="m">No investors yet. Add one in Investors.</div>';
 return `<div class="card"><h3>Total AUM</h3><div class="big">${S.inv.length?cmp$(cap):'$0.00'}</div><div class="m">${f$(cap)} · ${S.inv.length} entities · <span class="pos">${A.length} active</span> · ${S.inv.length-A.length} inactive</div></div>
 <div class="g"><div class="card"><h3>Pending payout (calc.)</h3><div class="big">${cmp$(pend)}</div><div class="m">${fxOK?cmpI(pendI):'INR: Unavailable (no FX)'}</div></div>
 <div class="card"><h3>Cycle</h3><div class="big">${pct}%</div><div class="m">${cs} → ${ce}<br>${el} elapsed · ${tot-el} remaining</div></div></div>
 <div class="card"><h3>Monthly return</h3>${mo}</div>
 <div class="card"><h3>Market references</h3><div class="row"><span>USD/INR</span><span>${S.fx?S.fx.rate.toFixed(4):'Unavailable'}</span></div><div class="m">${fxLabel()}</div>
 <div class="row"><span>Gold 24K /10g</span><span class="gold">Not connected</span></div><div class="row"><span>Silver /kg</span><span class="gold">Not connected</span></div><div class="row"><span>XAU reference</span><span class="gold">Not connected</span></div></div>
 <div class="card"><h3>Top mandates</h3>${top}</div>
 <div class="card"><h3>Algo Desk (read-only)</h3><div class="row"><span>Broker</span><span>Not connected</span></div><div class="row"><span>Equity</span><span>Unavailable</span></div><div class="row"><span>Mode</span><span>${S.mode==='paper'?'Paper Trading':'Live Trading — Disconnected'}</span></div></div>`;
}
/* ---------- INVESTORS ---------- */
function filt(){const q=S.q.toLowerCase();return S.inv.filter(i=>(!q||[i.name,i.contact,i.country].join(' ').toLowerCase().includes(q))&&(S.fa==='all'||(S.fa==='a')===i.active)&&(S.fc==='all'||i.cat===S.fc))}
function inv(){
 const L=filt(),cap=L.reduce((a,i)=>a+c2(i.capital),0);
 const cards=L.map(i=>{const c=payoutOf(i);return `<div class="card"><b>${esc(i.name)}</b> <span class="tag">${esc(i.cat)}</span> <span class="tag ${i.active?'pos':''}">${i.active?'Active':'Inactive'}${i.archived?' · Archived':''}</span>
 <div class="m">${esc(i.country)} · ${esc(i.contact)}</div>
 <div class="row"><span>Capital</span><span>${f$(c2(i.capital))}</span></div><div class="row"><span>Payout (Calculated)</span><span class="pos">${c?f$(c.net):'—'}</span></div><div class="row"><span>Net INR</span><span>${c&&c.inr!=null?fI(c.inr):'Unavailable'}</span></div>
 <button class="b s" onclick="invForm('${i.id}')">Edit</button><button class="b s" onclick="copyPay('${i.id}')">Copy Payout</button><button class="b s" onclick="S.sel.id='${i.id}';S.tab='stm';render()">Report</button><button class="b d" onclick="delInv('${i.id}')">Delete</button></div>`}).join('')||'<div class="card m">No investors match. Tap “Add investor”.</div>';
 return `<input placeholder="Search name, contact, jurisdiction" value="${esc(S.q)}" oninput="S.q=this.value;render();document.querySelector('input').focus()">
 <div class="g"><select onchange="S.fa=this.value;render()"><option value="all">All status</option><option value="a" ${S.fa==='a'?'selected':''}>Active</option><option value="i" ${S.fa==='i'?'selected':''}>Inactive</option></select>
 <select onchange="S.fc=this.value;render()"><option value="all">All categories</option>${CATS.map(c=>`<option ${S.fc===c?'selected':''}>${c}</option>`).join('')}</select></div>
 <div class="m" style="margin:8px 0">${L.length} of ${S.inv.length} shown · Capital ${f$(cap)}</div>
 <button class="b" onclick="invForm()">+ Add investor</button>${cards}`;
}
function invForm(id){const i=S.inv.find(x=>x.id===id)||{name:'',cat:'Individual',country:'',contact:'',capital:'',active:true};
 $('#mod').innerHTML=`<div class="modal"><div><h3>${id?'Edit':'Add'} investor</h3><label>Name</label><input id="f1" value="${esc(i.name)}"><label>Category</label><select id="f2">${CATS.map(c=>`<option ${i.cat===c?'selected':''}>${c}</option>`).join('')}</select>
 <label>Country / jurisdiction</label><input id="f3" value="${esc(i.country)}"><label>Authorized contact</label><input id="f4" value="${esc(i.contact)}"><label>Capital (USD)</label><input id="f5" inputmode="decimal" value="${i.capital}">
 <label>Status</label><select id="f6"><option value="1">Active</option><option value="0" ${i.active?'':'selected'}>Inactive</option></select><div id="err" class="neg"></div>
 <button class="b" onclick="saveInv('${id||''}')">Save</button><button class="b s" onclick="$('#mod').innerHTML=''">Cancel</button></div></div>`}
function saveInv(id){const v=k=>$('#'+k).value.trim(),cap=Number(v('f5').replace(/,/g,''));
 if(!v('f1')||!v('f3')||!v('f4'))return $('#err').textContent='Name, jurisdiction and contact are required.';
 if(!isFinite(cap)||cap<=0)return $('#err').textContent='Capital must be a positive number.';
 const o={name:v('f1'),cat:v('f2'),country:v('f3'),contact:v('f4'),capital:Math.round(cap*100)/100,active:v('f6')==='1'};
 if(id)Object.assign(S.inv.find(x=>x.id===id),o);else S.inv.push({id:'i'+Date.now(),...o});save();$('#mod').innerHTML='';render()}
function delInv(id){const i=S.inv.find(x=>x.id===id),has=S.hist.some(h=>h.invId===id);
 $('#mod').innerHTML=`<div class="modal"><div><h3>${has?'Archive':'Delete'} ${esc(i.name)}?</h3><p>${has?'This investor has issued statements, so it cannot be deleted. It will be archived and set Inactive; records are kept.':'This permanently removes the investor.'}</p>
 <button class="b d" onclick="doDel('${id}',${has})">Confirm ${has?'archive':'delete'}</button><button class="b s" onclick="$('#mod').innerHTML=''">Cancel</button></div></div>`}
function doDel(id,arch){if(arch){const i=S.inv.find(x=>x.id===id);i.active=false;i.archived=true}else S.inv=S.inv.filter(x=>x.id!==id);save();$('#mod').innerHTML='';render()}
function copyPay(id){const i=S.inv.find(x=>x.id===id),c=payoutOf(i);if(!c)return alert('Cannot calculate payout.');
 const t=`${i.name} (${i.cat}, ${i.country})\nStatus: Calculated (not finalized)\nCapital: ${f$(c2(i.capital))}\nPayout: ${f$(c.net)}\nNet INR: ${c.inr!=null?fI(c.inr):'Unavailable'}`;
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Copied'),()=>prompt('Copy:',t))}
/* ---------- STATEMENTS ---------- */
function stm(){
 const i=S.inv.find(x=>x.id===S.sel.id),c=i?calc(i.capital,S.sel.from,S.sel.to,S.rates,S.fx?S.fx.rate:null):null,rk=Object.keys(DEF);
 const L=ledger(c).map((r,k)=>`<div class="row"><span>${r[0]}<small>${BASIS[k]}</small></span><b>${r[1]}</b></div>`).join('');
 const hist=S.hist.slice().reverse().map(h=>`<div class="row"><span>${esc(h.inv)}<small>${h.from} → ${h.to} · ${new Date(h.snap.at).toLocaleString()}</small></span><span>${f$(h.snap.net)}<br><button class="b s" onclick="pdf('${h.id}')">PDF</button></span></div>`).join('')||'<div class="m">No issued statements.</div>';
 return `<div class="card"><h3>Investor & period</h3><select onchange="S.sel.id=this.value;render()"><option value="">Select investor…</option>${S.inv.map(x=>`<option value="${x.id}" ${x.id===S.sel.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
 <div class="g"><div><label>From</label><input type="date" value="${S.sel.from}" onchange="S.sel.from=this.value;render()"></div><div><label>To</label><input type="date" value="${S.sel.to}" onchange="S.sel.to=this.value;render()"></div></div>
 <label>USD/INR (${fxLabel()})</label><input inputmode="decimal" value="${S.fx?S.fx.rate:''}" placeholder="Enter manually if unavailable" onchange="setFX(this.value)"></div>
 <div class="card"><h3>Rates (%)</h3><div class="g">${rk.map(k=>`<div><label>${k}</label><input inputmode="decimal" value="${S.rates[k]}" onchange="setRate('${k}',this.value)"></div>`).join('')}</div>
 <button class="b" onclick="save();alert('Rates saved')">Save Rates</button><button class="b s" onclick="S.rates={...DEF};save();render()">Restore Default Rates</button>
 <div class="m">Defaults are placeholders — set per your agreements. Rounding: integer cents, half-up, per step. Order: gross → fees → GST → TDS → net → FX.</div></div>
 <div class="card"><h3>13-factor ledger</h3>${c?L:'<div class="m">Select an investor and a valid period (end after start).</div>'}</div>
 ${c?`<div class="card"><h3>Settlement</h3><div class="row"><span>Total Generated</span><b>${f$(c.gross)}</b></div><div class="row"><span>Total deductions</span><b class="neg">${f$(c.ded)}</b></div><div class="row"><span>Net Payout USD</span><b class="pos">${f$(c.net)}</b></div><div class="row"><span>Effective FX</span><b>${c.eff?c.eff.toFixed(4):'Unavailable'}</b></div><div class="row"><span>Final Net INR</span><b class="pos">${fI(c.inr)}</b></div>
 <div class="m">Calculated ${new Date(c.at).toLocaleString()} · FX: ${fxLabel()}</div>
 ${S.set.history?`<button class="b" ${c.inr==null?'disabled':''} onclick="issue()">Issue Statement PDF</button>`:'<div class="m">Statement history is disabled. <a href="#" style="color:var(--gold)" onclick="settings();return false">Open Settings</a> to enable issuing.</div>'}</div>`:''}
 <div class="card"><h3>Issued statements</h3>${hist}</div>`;
}
function setRate(k,v){const n=Number(v);if(!isFinite(n)||n<0||n>100)return alert('Rate must be 0–100');S.rates[k]=n;render()}
function setFX(v){const n=Number(v);if(!(n>0))return;S.fx={rate:n,src:'manual',at:new Date().toISOString(),manual:true};render()}
function issue(){const i=S.inv.find(x=>x.id===S.sel.id),c=calc(i.capital,S.sel.from,S.sel.to,S.rates,S.fx.rate);
 const h={id:'s'+Date.now(),invId:i.id,inv:i.name,cat:i.cat,country:i.country,from:S.sel.from,to:S.sel.to,snap:Object.freeze(c),fxSrc:fxLabel()};S.hist.push(h);save();render();pdf(h.id)}
function pdf(id){const h=S.hist.find(x=>x.id===id),c=h.snap,rows=ledger(c).map((r,k)=>`<tr><td style="padding:4px;border-bottom:1px solid #ccc">${r[0]}<br><small style="color:#666">${BASIS[k]}</small></td><td style="padding:4px;border-bottom:1px solid #ccc;text-align:right">${r[1]}</td></tr>`).join('');
 const el=document.createElement('div');el.style.cssText='padding:24px;font:12px Arial;color:#000;background:#fff;width:700px';
 el.innerHTML=`<h2 style="color:#8a6d2f">AUREUS CAPITAL — Settlement Statement</h2><p><b>${esc(h.inv)}</b> (${esc(h.cat)}, ${esc(h.country)})<br>Period: ${h.from} → ${h.to}<br>Issued: ${new Date(c.at).toLocaleString()}<br>FX source: ${esc(h.fxSrc)}</p><table style="width:100%;border-collapse:collapse">${rows}</table>
 <p>Rates: ${Object.entries(c.r).map(e=>e[0]+' '+e[1]+'%').join(', ')}</p><p>Total deductions: ${f$(c.ded)}<br>Net USD: <b>${f$(c.net)}</b><br>Effective FX: ${c.eff?c.eff.toFixed(4):'—'}<br>Final Net INR: <b>${fI(c.inr)}</b></p>`;
 if(window.html2pdf)html2pdf().from(el).set({filename:'statement-'+h.id+'.pdf',jsPDF:{format:'a4'}}).save();else alert('PDF library not loaded (needs internet).')}
/* ---------- ALGO DESK (independent of CRM) ---------- */
function algo(){
 const U=['Algorithm status','Broker connection','Realized P&L','Unrealized P&L','Net P&L / return','Win rate (closed trades)','Balance','Equity','Used margin','Free margin','Market data'];
 const cs=['Deploy Algo','Start Algo','Pause Entries','Stop Algo','Close All Positions'];
 const st=S.strat.map(s=>`<div class="row"><span>${esc(s.name)}<small>v${s.ver} · ${esc(s.inst)} · ${esc(s.tf)} · cap ${s.cap}% · lots ${s.lot} · SL ${s.sl} TP ${s.tp} · max daily loss ${s.mdl}% · DD ${s.mdd}%</small></span><span><button class="b s" onclick="stratForm('${s.id}')">Edit</button></span></div>`).join('')||'<div class="m">No strategies configured.</div>';
 return `<div class="card"><h3>Trading mode</h3><div class="big">${S.mode==='paper'?'Paper Trading':'Live Trading — Disconnected'}</div><div class="m">Broker: Not connected · Market data: Unavailable. Mode changes never submit orders.</div>
 <button class="b ${S.mode==='paper'?'':'s'}" onclick="S.mode='paper';render()">Paper</button><button class="b ${S.mode==='live'?'':'s'}" onclick="liveConfirm()">Live</button></div>
 <div class="card"><h3>Account & performance</h3>${U.map(u=>`<div class="row"><span>${u}</span><span class="m">${u==='Algorithm status'?'Not deployed':u==='Broker connection'?'Not connected':'Unavailable'}</span></div>`).join('')}</div>
 <div class="card"><h3>Positions & orders</h3><div class="m">No open positions. Connect a broker API in Settings to see positions, orders and holdings.</div></div>
 <div class="card"><h3>Controls</h3>${cs.map(c=>`<button class="b ${c.startsWith('Close')?'d':''}" ${c==='Deploy Algo'?'onclick="stratMgr()"':'disabled'}>${c}</button>`).join('')}<div class="m">Execution controls are disabled until a broker, server-side risk checks and authorization are configured.</div></div>
 <div class="card"><h3>Strategies</h3>${st}<button class="b" onclick="stratForm()">+ Add Strategy</button></div>`;
}
function stratMgr(){S.tab='algo';render();scrollTo(0,document.body.scrollHeight)}
function liveConfirm(){$('#mod').innerHTML=`<div class="modal"><div><h3>Switch to Live Trading?</h3><p>Real-money mode. Switching does not place orders. Server-side authorization is required for execution and is not configured here. Type LIVE to confirm.</p><input id="lc"><button class="b d" onclick="if($('#lc').value==='LIVE'){S.mode='live';$('#mod').innerHTML='';render()}else alert('Type LIVE')">Confirm</button><button class="b s" onclick="$('#mod').innerHTML=''">Cancel</button></div></div>`}
function stratForm(id){const s=S.strat.find(x=>x.id===id)||{name:'Momentum Breakout',inst:'',tf:'15m',cap:10,lot:0.1,max:3,sl:'',tp:'',mdl:2,mdd:10,sess:'',cd:5,ver:1};const f=[['name','Name (e.g. Momentum Breakout / Mean Reversion / Trend Filter)'],['inst','Instrument'],['tf','Timeframe'],['cap','Capital allocation %'],['lot','Order size (lots)'],['max','Max positions'],['sl','Stop-loss'],['tp','Take-profit'],['mdl','Max daily loss %'],['mdd','Max drawdown %'],['sess','Sessions'],['cd','Cooldown (min)']];
 $('#mod').innerHTML=`<div class="modal"><div><h3>${id?'Edit':'Add'} strategy</h3>${f.map(k=>`<label>${k[1]}</label><input id="s_${k[0]}" value="${esc(s[k[0]])}">`).join('')}<div id="err" class="neg"></div><button class="b" onclick="saveStrat('${id||''}')">Save</button><button class="b s" onclick="$('#mod').innerHTML=''">Cancel</button></div></div>`;S._f=f}
function saveStrat(id){const o={};S._f.forEach(k=>o[k[0]]=$('#s_'+k[0]).value.trim());
 for(const k of['cap','lot','max','mdl','mdd','cd'])if(!(Number(o[k])>=0&&o[k]!==''))return $('#err').textContent='Invalid '+k;if(!o.name||!o.inst)return $('#err').textContent='Name and instrument required';if(Number(o.cap)>100)return $('#err').textContent='Allocation ≤ 100%';
 if(id){const s=S.strat.find(x=>x.id===id);Object.assign(s,o,{ver:s.ver+1})}else S.strat.push({id:'t'+Date.now(),ver:1,...o});save();$('#mod').innerHTML='';render()}
/* ---------- SETTINGS ---------- */
function settings(){const sec=['Market Data Providers','Broker Connections','API Credentials','Trading Risk Controls'].map(t=>`<div class="card"><h3>${t}</h3><div class="m">Not configured. Credentials must be stored server-side; never entered or shown in this file.</div></div>`).join('');
 $('#mod').innerHTML=`<div class="modal"><div><h3>Settings</h3>${sec}
 <div class="card"><h3>Settlement Defaults</h3><label>Cycle start</label><input type="date" value="${S.set.cycleStart}" onchange="S.set.cycleStart=this.value;save()"><label>Cycle end</label><input type="date" value="${S.set.cycleEnd}" onchange="S.set.cycleEnd=this.value;save()"><div class="m">Rates are edited on the Statements screen.</div></div>
 <div class="card"><h3>Statement History</h3><label><input type="checkbox" style="width:auto" ${S.set.history?'checked':''} onchange="S.set.history=this.checked;save()"> Enable immutable statement snapshots</label></div>
 <div class="card"><h3>Developer Tools</h3><div class="m">Webhook example (secret is server-side, referenced only by name MT5_WEBHOOK_SECRET):</div><pre class="sc m">curl -X POST $WEBHOOK_URL \\\n -H "X-Signature: &lt;hmac-from-server&gt;" \\\n -d '{"event":"ping"}'</pre></div>
 <div class="card"><h3>Integration Diagnostics</h3><div class="row"><span>FX provider</span><span>${fxLabel()}</span></div><div class="row"><span>Broker</span><span>Not connected</span></div><div class="row"><span>Metals feed</span><span>Not connected</span></div><button class="b s" onclick="loadFX();$('#mod').innerHTML=''">Refresh FX</button></div>
 <button class="b s" onclick="$('#mod').innerHTML='';render()">Close</button></div></div>`}
render();loadFX();
</script></body></html>
