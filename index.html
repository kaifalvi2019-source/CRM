<style>
:root{
  --bg:#050607;
  --surface:#0c0f12;
  --surface-2:#11151a;
  --surface-3:#151a20;
  --glass:rgba(17,21,26,.78);
  --border:rgba(212,175,55,.18);
  --border-soft:rgba(255,255,255,.075);
  --gold:#d4af37;
  --gold-soft:rgba(212,175,55,.12);
  --cobalt:#3b82f6;
  --cobalt-soft:rgba(59,130,246,.12);
  --accent:var(--gold);
  --accent-soft:var(--gold-soft);
  --emerald:#10b981;
  --emerald-soft:rgba(16,185,129,.12);
  --red:#ef4444;
  --red-soft:rgba(239,68,68,.12);
  --white:#f4f6f8;
  --text:#e7eaee;
  --muted:#9299a3;
  --slate:#68717d;
  --shadow:0 18px 60px rgba(0,0,0,.42);
  --radius:22px;
  --radius-sm:15px;
  --nav-h:78px;
  --header-h:68px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button,input,select{font:inherit}
button{border:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{
  width:100%;max-width:1120px;min-height:100dvh;margin:auto;
  background:
    radial-gradient(circle at 20% -10%,rgba(212,175,55,.07),transparent 30%),
    radial-gradient(circle at 100% 20%,rgba(16,185,129,.035),transparent 28%),
    var(--bg);
}
@media(min-width:900px){
  body{padding:20px}
  .app{min-height:calc(100dvh - 40px);border:1px solid var(--border-soft);border-radius:30px;overflow:hidden;box-shadow:var(--shadow)}
}
.splash{
  position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#030405;
  transition:opacity .55s var(--ease),visibility .55s;
}
.splash.hide{opacity:0;visibility:hidden}
.splash-inner{text-align:center;width:min(260px,80vw)}

  animation:logoPulse 1.7s ease-in-out infinite;

.logo svg{width:34px;height:34px}
.splash-name{margin-top:20px;font-weight:700;letter-spacing:.08em;font-size:14px;color:var(--white)}
.splash-sub{margin-top:7px;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

.loader i{display:block;width:0;height:100%;background:var(--gold);animation:load 1.15s var(--ease) forwards}

}

  width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.045);

}
.header-btn:active{transform:scale(.94)}
.header-title{flex:1;min-width:0}

.header-title span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 5px var(--emerald-soft);animation:live 1.8s infinite}
@keyframes live{50%{opacity:.55}}
main{padding:18px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px)}
.view{display:none;animation:pageIn .32s var(--ease)}
.view.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1,h2,h3,p{margin:0}
.page-heading{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:6px 0 18px}
.page-heading h1{font-size:27px;line-height:1.08;letter-spacing:-.035em;color:var(--white)}
.page-heading p{font-size:12px;color:var(--muted);margin-top:7px}
.stack{display:grid;gap:12px}
.grid{display:grid;gap:12px}

.card{

  border:1px solid var(--border-soft);border-radius:var(--radius);box-shadow:0 12px 35px rgba(0,0,0,.18);

.card-pad{padding:18px}

}
.manager-name{font-weight:750;color:var(--white);font-size:16px}
.manager-role{font-size:11px;color:var(--muted);margin-top:3px}

  font-size:10px;font-weight:750;letter-spacing:.06em;text-transform:uppercase

.badge.gold{color:var(--gold);background:var(--gold-soft);border:1px solid rgba(212,175,55,.2)}

.manager-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat-mini{padding:13px;border-radius:15px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.045)}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat-value{font-size:19px;font-weight:760;margin-top:5px;letter-spacing:-.025em}
.gold{color:var(--gold)!important}.positive{color:var(--emerald)!important}.muted{color:var(--muted)!important}
.overview{padding:18px}
.overview-head{display:flex;justify-content:space-between;align-items:center}
.overview-title{font-size:13px;font-weight:700}.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:17px}
.metric-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.metric-value{font-size:21px;font-weight:760;margin-top:4px;letter-spacing:-.03em}
.performance{padding:18px}
.performance-top{display:flex;justify-content:space-between;align-items:start;gap:12px}

.progress{height:6px;background:#1b2026;border-radius:99px;overflow:hidden;margin-top:18px}
.progress span{display:block;height:100%;background:var(--emerald);border-radius:99px;transition:width .7s var(--ease)}
.performance-foot{display:flex;justify-content:space-between;margin-top:9px;font-size:10px;color:var(--muted)}
.market-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.market-card{padding:16px}
.market-value{font-size:21px;font-weight:760;margin-top:7px}
.market-status{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:10px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{
  min-height:46px;padding:0 15px;border-radius:14px;cursor:pointer;font-weight:700;font-size:12px;
  transition:transform .18s var(--ease),opacity .18s,background .18s,border-color .18s
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--gold);color:#090a0b}
.btn-secondary{background:rgba(255,255,255,.05);color:var(--text);border:1px solid rgba(255,255,255,.08)}
.btn-emerald{background:var(--emerald);color:#03120d}
.btn-danger{background:var(--red-soft);color:#ff8585;border:1px solid rgba(239,68,68,.2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.section-title h2{font-size:13px;color:var(--white)}
.section-title button{background:none;color:var(--gold);font-size:11px;cursor:pointer}
.search{
  width:100%;height:46px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);
  border-radius:14px;color:var(--white);padding:0 14px;margin-bottom:10px
}
.filters{display:flex;gap:7px;overflow:auto;padding-bottom:2px;margin-bottom:12px}
.filter{white-space:nowrap;padding:8px 11px;border-radius:99px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);color:var(--muted);font-size:10px;cursor:pointer}
.filter.active{color:var(--gold);border-color:rgba(212,175,55,.3);background:var(--gold-soft)}
.investor{padding:15px;display:flex;gap:12px;align-items:center;position:relative;z-index:1;touch-action:pan-y;transition:transform .22s ease;will-change:transform}
.investor-swipe-wrap{position:relative;overflow:hidden;border-radius:var(--radius);background:#7f1d1d}
.investor-delete-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:0 22px;color:#fff;font-size:12px;font-weight:800;letter-spacing:.04em;background:linear-gradient(90deg,#991b1b,#dc2626);pointer-events:none}
.investor.swiping{transition:none}
.inv-avatar{width:42px;height:42px;border-radius:13px;background:#171c21;display:grid;place-items:center;color:var(--white);font-size:12px;font-weight:800}
.inv-main{flex:1;min-width:0}
.inv-name{font-size:13px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-meta{display:flex;gap:9px;margin-top:4px;font-size:10px;color:var(--muted);flex-wrap:wrap}
.inv-right{text-align:right}.inv-profit{font-size:14px;font-weight:750;color:var(--emerald)}.inv-cap{font-size:10px;color:var(--muted);margin-top:4px}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px}
.status-active{background:var(--emerald)}.status-pending{background:var(--gold)}.status-settled{background:var(--slate)}.status-inactive{background:var(--slate)}
.form-card{padding:18px}
.field{display:grid;gap:7px;margin-bottom:13px}
.field label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.field input,.field select{
  width:100%;height:46px;background:#0b0e11;color:var(--white);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:0 13px

.field input::placeholder{color:#56606c}
.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:5px}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.switch{position:relative;width:44px;height:25px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:99px;background:#252b31;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;border-radius:50%;background:#9aa1aa;transition:.2s}.switch input:checked+.slider{background:var(--emerald)}.switch input:checked+.slider:before{transform:translateX(19px);background:#fff}
.preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.preset{
  padding:15px;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);
  color:var(--white);cursor:pointer;text-align:left;transition:.2s var(--ease)
}
.preset:active{transform:scale(.98)}.preset.active{border-color:rgba(212,175,55,.4);background:var(--gold-soft)}.preset strong{display:block;font-size:17px}.preset span{font-size:10px;color:var(--muted);display:block;margin-top:4px}
.result{padding:19px;border-color:rgba(16,185,129,.22);background:linear-gradient(145deg,rgba(16,185,129,.06),rgba(10,13,16,.92))}
.result-main{display:flex;justify-content:space-between;align-items:end;gap:10px}.result-net{font-size:32px;font-weight:820;color:var(--emerald);letter-spacing:-.05em}
.breakdown{margin-top:17px;border-top:1px solid rgba(255,255,255,.06)}.break-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.045);font-size:11px}.break-row span:first-child{color:var(--muted)}.break-row span:last-child{font-weight:650}
.notice{padding:12px 14px;border-radius:14px;background:rgba(212,175,55,.06);border:1px solid rgba(212,175,55,.12);font-size:10px;line-height:1.55;color:var(--muted)}
.more-item{display:flex;align-items:center;gap:12px;padding:15px;border-radius:16px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);cursor:pointer}
.more-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#161b20;color:var(--gold)}
.more-item strong{font-size:12px}.more-item span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.nav{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:50;width:min(100%,1120px);
  min-height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:8px 10px env(safe-area-inset-bottom);
  background:rgba(7,9,11,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid rgba(255,255,255,.07);display:grid;grid-template-columns:repeat(5,1fr)
}
.nav button{background:none;color:#68717d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:9px;font-weight:650;transition:.2s}
.nav button svg{width:20px;height:20px}.nav button.active{color:var(--gold)}.nav button:active{transform:scale(.94)}
.modal{
  position:fixed;inset:0;z-index:100;display:none;align-items:end;background:rgba(0,0,0,.68);backdrop-filter:blur(8px)
}
.modal.open{display:flex}
.sheet{width:100%;max-height:92dvh;overflow:auto;background:#0b0e11;border:1px solid rgba(255,255,255,.08);border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));animation:sheetIn .28s var(--ease)}
@keyframes sheetIn{from{transform:translateY(30px);opacity:.7}to{transform:none;opacity:1}}
.handle{width:38px;height:4px;border-radius:99px;background:#30363d;margin:3px auto 17px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet-head h2{font-size:18px}.close{width:34px;height:34px;border-radius:10px;background:#171b20;color:var(--muted);cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);transform:translate(-50%,15px);z-index:300;opacity:0;pointer-events:none;max-width:calc(100% - 30px);padding:11px 14px;border-radius:13px;background:#161b20;border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);font-size:11px;color:var(--white);transition:.25s var(--ease)}

.empty strong{display:block;color:var(--text);margin-bottom:5px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.detail{padding:12px;border-radius:13px;background:rgba(255,255,255,.025)}
.detail span{font-size:9px;color:var(--muted);display:block}
.detail strong{display:block;margin-top:5px;font-size:14px}
.small-note{font-size:10px;color:var(--muted);line-height:1.55}
html[data-theme="emerald"]{--accent:var(--emerald);--accent-soft:var(--emerald-soft)}
html[data-theme="cobalt"]{--accent:var(--cobalt);--accent-soft:var(--cobalt-soft)}
.theme-accent{color:var(--accent)!important}
.btn-primary.theme-accent-btn{background:var(--accent);color:#050607}
.nav button.active.theme-accent-nav{color:var(--accent)}
.filter.active.theme-accent-filter{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}

  main{padding:28px 30px 40px}
  .dashboard-grid{display:grid;grid-template-columns:1.25fr .9fr;gap:12px;align-items:start}
  .full{grid-column:1/-1}
  .actions{max-width:520px}
  .nav{position:sticky;bottom:0;border:0;border-top:1px solid rgba(255,255,255,.06)}
