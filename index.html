<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aureus — Executive Summary & Settlement</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        midnight: '#080B0A',
                        graphite: '#111816',
                        goldAccent: '#C6A56A',
                        emeraldLive: '#00B982',
                        royalBlue: '#3B82F6',
                        softGrey: '#8D9A93',
                        softWhite: '#F3F4F6'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #080B0A; color: #F3F4F6; font-family: ui-sans-serif, system-ui, sans-serif; overflow-x: hidden; }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .card-box {
            background: linear-gradient(145deg, #111816 0%, #0d1311 100%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 1.25rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease;
            touch-action: pan-y;
        }
        .tier-gold-card { background: linear-gradient(135deg, rgba(198, 165, 106, 0.42) 0%, #111816 75%) !important; border: 1px solid rgba(198, 165, 106, 0.8) !important; }
        .tier-silver-card { background: linear-gradient(135deg, rgba(156, 163, 175, 0.35) 0%, #111816 75%) !important; border: 1px solid rgba(156, 163, 175, 0.7) !important; }
        .tier-bronze-card { background: linear-gradient(135deg, rgba(180, 115, 75, 0.42) 0%, #111816 75%) !important; border: 1px solid rgba(180, 115, 75, 0.8) !important; }
        .tier-normal-card { background: linear-gradient(145deg, #111816 0%, #0d1311 100%) !important; border: 1px solid rgba(255, 255, 255, 0.07) !important; }
    </style>
</head>
<body class="min-h-screen pb-32">

    <!-- TOP HEADER -->
    <header class="sticky top-0 z-40 bg-midnight/95 backdrop-blur-md border-b border-gray-900/80 px-4 py-3.5 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-gray-800 to-midnight border border-goldAccent/30 flex items-center justify-center text-goldAccent font-extrabold text-sm shadow-md">A</div>
            <div>
                <p class="text-[9px] text-goldAccent uppercase tracking-widest font-bold">AUREUS CAPITAL</p>
                <h1 class="text-sm font-bold text-softWhite tracking-tight">Executive Summary</h1>
            </div>
        </div>
        <button onclick="openSettings()" class="p-2.5 rounded-xl card-box text-softGrey hover:text-softWhite transition active:scale-95">⚙️</button>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 py-5 space-y-4">
        
        <!-- TAB 1: HOME -->
        <section id="tab-home" class="space-y-4 hidden">
            <div class="card-box p-5 space-y-3">
                <h2 class="text-lg font-bold text-softWhite">Dashboard Overview</h2>
                <p class="text-xs text-softGrey">Welcome back, Kaif Alvi.</p>
            </div>
        </section>

        <!-- TAB 2: INVESTOR PORTFOLIO -->
        <section id="tab-investors" class="space-y-4">
            <div class="flex justify-between items-center px-1">
                <div>
                    <p class="text-[9px] text-softGrey uppercase tracking-widest font-bold">DIRECTORY</p>
                    <h2 class="text-base font-bold text-softWhite tracking-tight">Investors</h2>
                </div>
                <button onclick="openAddInvestorModal()" class="px-4 py-2.5 bg-goldAccent text-midnight text-xs font-extrabold rounded-xl shadow-lg">+ Add</button>
            </div>

            <div class="space-y-3.5 pt-1" id="investors-list-container">
                <!-- Dynamically populated cards -->
            </div>
        </section>

        <!-- TAB 3: SETTLEMENT -->
        <section id="tab-settlement" class="space-y-4 hidden">
            <div class="card-box p-5 space-y-3">
                <h2 class="text-lg font-bold text-softWhite">Settlement & Calculator</h2>
                <p class="text-xs text-softGrey">Manage payouts and statements here.</p>
            </div>
        </section>

        <!-- TAB 4: MORE -->
        <section id="tab-more" class="space-y-4 hidden">
            <div class="card-box p-5 space-y-3">
                <h2 class="text-lg font-bold text-softWhite">Settings & Info</h2>
                <p class="text-xs text-softGrey">Lead Manager: Kaif Alvi</p>
            </div>
        </section>
    </main>

    <!-- FIXED 4-TAB BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 bg-midnight/95 backdrop-blur-xl border-t border-gray-900/80 py-2.5 px-4 z-40">
        <div class="max-w-md mx-auto grid grid-cols-4 gap-2 text-center text-xs font-bold">
            <button onclick="switchTab('home')" id="nav-home" class="py-2 rounded-xl text-softGrey">HOME</button>
            <button onclick="switchTab('investors')" id="nav-investors" class="py-2 rounded-xl text-goldAccent bg-goldAccent/10">INVESTORS</button>
            <button onclick="switchTab('settlement')" id="nav-settlement" class="py-2 rounded-xl text-softGrey">SETTLEMENT</button>
            <button onclick="switchTab('more')" id="nav-more" class="py-2 rounded-xl text-softGrey">MORE</button>
        </div>
    </nav>

    <!-- ADD / EDIT INVESTOR MODAL -->
    <div id="investor-modal" class="fixed inset-0 bg-midnight/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="card-box rounded-2xl max-w-md w-full p-6 space-y-4 border border-gray-800 shadow-2xl">
            <div class="flex items-center justify-between border-b border-gray-900 pb-3">
                <h3 class="text-sm font-bold text-softWhite" id="modal-title">Add New Investor Mandate</h3>
                <button onclick="closeAddInvestorModal()" class="text-softGrey hover:text-softWhite text-sm font-bold p-1">✕</button>
            </div>
            <div class="space-y-3 text-xs">
                <input type="hidden" id="edit-inv-id">
                <div>
                    <label class="block text-softGrey mb-1 font-medium">Investor / Entity Name</label>
                    <input type="text" id="inv-name" placeholder="e.g. Apex Global Fund" class="w-full bg-midnight border border-gray-800 rounded-xl px-3.5 py-2.5 text-softWhite focus:outline-none focus:border-goldAccent">
                </div>
                <div>
                    <label class="block text-softGrey mb-1 font-medium">Capital Investment (INR ₹)</label>
                    <input type="number" id="inv-capital" placeholder="500000" class="w-full bg-midnight border border-gray-800 rounded-xl px-3.5 py-2.5 text-softWhite tabular-nums focus:outline-none focus:border-goldAccent">
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeAddInvestorModal()" class="px-4 py-2 bg-midnight text-softGrey rounded-xl border border-gray-800">Cancel</button>
                <button onclick="saveInvestor()" class="px-4 py-2 bg-goldAccent text-midnight font-bold rounded-xl shadow-md">Save Mandate</button>
            </div>
        </div>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        let investors = JSON.parse(localStorage.getItem('aureus_investors')) || [
            { id: 101, name: "Zaif", capital: 250000, active: true, settled: false }
        ];

        function saveInvestorsToStorage() {
            localStorage.setItem('aureus_investors', JSON.stringify(investors));
        }

        function switchTab(tabId) {
            ['home', 'investors', 'settlement', 'more'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                const btn = document.getElementById(`nav-${t}`);
                btn.className = "py-2 rounded-xl text-softGrey";
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).className = "py-2 rounded-xl text-goldAccent bg-goldAccent/10";
            window.scrollTo(0,0);
        }

        function openSettings() { alert("Settings Panel"); }

        function openAddInvestorModal(editId = null, event = null) {
            if(event) event.stopPropagation();
            document.getElementById('edit-inv-id').value = '';
            document.getElementById('inv-name').value = '';
            document.getElementById('inv-capital').value = '';
            
            if(editId) {
                const inv = investors.find(i => i.id === editId);
                if(inv) {
                    document.getElementById('modal-title').innerText = "Edit Investor Mandate";
                    document.getElementById('edit-inv-id').value = inv.id;
                    document.getElementById('inv-name').value = inv.name;
                    document.getElementById('inv-capital').value = inv.capital;
                }
            } else {
                document.getElementById('modal-title').innerText = "Add New Investor Mandate";
            }
            document.getElementById('investor-modal').classList.remove('hidden');
        }

        function closeAddInvestorModal() { document.getElementById('investor-modal').classList.add('hidden'); }

        function deleteInvestor(id) {
            investors = investors.filter(inv => inv.id !== id);
            saveInvestorsToStorage();
            updateDashboard();
        }

        function saveInvestor() {
            const editId = document.getElementById('edit-inv-id').value;
            const name = document.getElementById('inv-name').value.trim();
            const capital = parseFloat(document.getElementById('inv-capital').value);

            if(!name || isNaN(capital) || capital <= 0) { alert('Please enter a valid investor name and capital amount.'); return; }

            if(editId) {
                const inv = investors.find(i => i.id == editId);
                if(inv) { inv.name = name; inv.capital = capital; }
            } else {
                investors.push({ id: Date.now(), name, capital, active: true, settled: false });
            }

            saveInvestorsToStorage();
            closeAddInvestorModal();
            updateDashboard();
        }

        function updateDashboard() {
            investors.sort((a, b) => b.capital - a.capital);
            const listContainer = document.getElementById('investors-list-container');
            if(!listContainer) return;

            if(investors.length === 0) {
                listContainer.innerHTML = `<div class="card-box p-8 text-center"><p class="text-xs text-softWhite font-bold">No investors found</p></div>`;
            } else {
                listContainer.innerHTML = investors.map((inv) => {
                    const rank = investors.findIndex(i => i.id === inv.id) + 1;
                    let cardClass = rank === 1 ? "card-box tier-gold-card" : rank === 2 ? "card-box tier-silver-card" : rank === 3 ? "card-box tier-bronze-card" : "card-box tier-normal-card";

                    return `
                        <div class="relative overflow-hidden rounded-[1.25rem] mb-3.5 shadow-lg">
                            <div class="absolute inset-0 bg-red-950 flex items-center justify-end pr-6 text-red-400 font-bold text-xs">
                                <span>🗑️ Delete</span>
                            </div>
                            <div id="card-${inv.id}" 
                                 ontouchstart="handleTouchStart(event, ${inv.id})" 
                                 ontouchmove="handleTouchMove(event, ${inv.id})" 
                                 ontouchend="handleTouchEnd(event, ${inv.id})"
                                 onmousedown="handleMouseDown(event, ${inv.id})"
                                 class="${cardClass} p-4 space-y-3 relative z-10 select-none">
                                <div class="flex justify-between items-center cursor-pointer" onclick="openAddInvestorModal(${inv.id}, event)">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-xl bg-midnight border border-gray-800 flex items-center justify-center text-softWhite font-bold text-sm shadow-inner">${rank}</div>
                                        <div>
                                            <h4 class="font-bold text-softWhite text-sm capitalize">${inv.name}</h4>
                                            <p class="text-[11px] text-softGrey mt-0.5">Investment: <span class="text-goldAccent font-semibold tabular-nums">INR ${inv.capital.toLocaleString('en-IN')}</span></p>
                                        </div>
                                    </div>
                                    <span class="text-[10px] bg-emerald-950 text-emeraldLive px-2.5 py-1 rounded-full border border-emerald-800/40 font-bold">Active</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        let startX = 0;
        let currentX = 0;
        let activeCardId = null;
        let isSwiping = false;

        function handleTouchStart(e, id) {
            startX = e.touches[0].clientX;
            activeCardId = id;
            isSwiping = false;
        }

        function handleTouchMove(e, id) {
            if (activeCardId !== id) return;
            currentX = e.touches[0].clientX;
            const diff = currentX - startX;
            if (Math.abs(diff) > 15) {
                isSwiping = true;
                const card = document.getElementById(`card-${id}`);
                if (card && diff < 0) {
                    card.style.transform = `translateX(${diff}px)`;
                }
            }
        }

        function handleTouchEnd(e, id) {
            if (activeCardId !== id) return;
            const card = document.getElementById(`card-${id}`);
            const diff = currentX - startX;
            if (card) {
                if (isSwiping && diff < -120) {
                    card.style.transform = `translateX(-100%)`;
                    setTimeout(() => deleteInvestor(id), 250);
                } else {
                    card.style.transform = `translateX(0px)`;
                }
            }
            activeCardId = null;
            startX = 0;
            currentX = 0;
            isSwiping = false;
        }

        function handleMouseDown(e, id) {
            startX = e.clientX;
            activeCardId = id;
            isSwiping = false;
            const onMouseMove = (moveEvent) => {
                if (activeCardId !== id) return;
                currentX = moveEvent.clientX;
                const diff = currentX - startX;
                if (Math.abs(diff) > 15) {
                    isSwiping = true;
                    const card = document.getElementById(`card-${id}`);
                    if (card && diff < 0) {
                        card.style.transform = `translateX(${diff}px)`;
                    }
                }
            };
            const onMouseUp = (upEvent) => {
                if (activeCardId !== id) return;
                const card = document.getElementById(`card-${id}`);
                const diff = currentX - startX;
                if (card) {
                    if (isSwiping && diff < -120) {
                        card.style.transform = `translateX(-100%)`;
                        setTimeout(() => deleteInvestor(id), 250);
                    } else {
                        card.style.transform = `translateX(0px)`;
                    }
                }
                activeCardId = null;
                startX = 0;
                currentX = 0;
                isSwiping = false;
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
            };
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }

        window.onload = function() {
            updateDashboard();
        };
    </script>
</body>
</html>
